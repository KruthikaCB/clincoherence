# Alembic Configuration for ClinCoherence

[alembic]
# Path to migration scripts (relative to this file)
script_location = alembic

# Template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path prepend — ensures app package is importable
prepend_sys_path = .

# Timezone for migration revision timestamps
# timezone =

# Max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# Set to 'true' to run environment setup for 'revision' command
# regardless of autogenerate
# revision_environment = false

# Set to 'true' to allow .hierarchyformat upgrades
# sourceless = false

# Version path separator
# version_path_separator = os

# Output encoding
output_encoding = utf-8

# Database URL — overridden by env.py to use app settings
sqlalchemy.url = postgresql+asyncpg://clincoherence_user:changeme@localhost:5432/clincoherence_db


[post_write_hooks]
# Lint migration files with ruff after generation
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

